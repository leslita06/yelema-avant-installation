<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Avant votre installation, par Yelema</title>
<meta name="description" content="Six minutes pour préparer la séance d'installation de vos Experts IA Yelema.">
<link rel="icon" href="assets/logo/yelema-icon.png">
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:swap;src:url('assets/fonts/SpaceGrotesk-Variable.woff2') format('woff2')}
@font-face{font-family:'Funnel Display';font-weight:300 800;font-display:swap;src:url('assets/fonts/FunnelDisplay-Variable.woff2') format('woff2')}
:root{
  --indigo:#301667;--violet:#8D68FA;--violet-deep:#4A299C;--lav:#C5C4FF;--lavp:#E0E1FF;
  --lilac:#F3EFFE;--lilac2:#EFE9FF;--bleu:#2E4EC4;--corail:#E4765A;--ink:#241A3A;--muted:#6B6580;--grey2:#938DA8;--line:#ECE8FA;
  --green:#22A45D;--grad:linear-gradient(135deg,#2E4EC4,#8D68FA);
  --hero:linear-gradient(160deg,#FFFFFF 0%,#F3EFFE 50%,#E0E1FF 100%);
  --sh:0 1px 2px rgba(48,22,103,.05),0 8px 24px rgba(48,22,103,.06);--sh2:0 2px 4px rgba(48,22,103,.05),0 18px 44px rgba(48,22,103,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Funnel Display',system-ui,sans-serif;color:var(--ink);background:#F8F7FC;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4,.sg{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;color:inherit}
.ic{display:inline-block;width:22px;height:22px;flex:0 0 auto}
.ic svg{width:100%;height:100%;display:block}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.eyebrow{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:16px;height:64px}
.top img.logo{height:26px}
.prog{flex:1;height:8px;border-radius:999px;background:var(--lilac2);overflow:hidden;max-width:420px;margin-left:auto}
.prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stepn{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.screen{display:none;padding:36px 0 60px;min-height:calc(100vh - 64px)}
.screen.on{display:block;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q-ic{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(141,104,250,.35)}
.q-ic .ic{width:26px;height:26px}
.screen h2{font-size:32px;color:var(--indigo);margin:14px 0 6px;line-height:1.1}
.lede{color:var(--muted);font-size:17px;margin:0 0 24px;max-width:640px}
.sub{flex-wrap:wrap;font-family:'Space Grotesk';font-weight:600;color:var(--indigo);font-size:18px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.sub small{flex-basis:100%;font-family:'Funnel Display';font-weight:400;color:var(--muted);font-size:14px}
/* accueil */
.hero{background:var(--hero);border-bottom:1px solid var(--line);border-radius:0 0 40px 40px;padding:44px 0 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;bottom:-110px;width:380px;height:380px;background:url('assets/site-pattern-3.svg') no-repeat center/contain;opacity:.12}
.hero h1{font-size:50px;line-height:1.04;margin:12px 0 16px;color:var(--indigo);max-width:640px}
.hero h1 em{font-style:normal;color:var(--corail)}
.hero p{color:#4A4560;font-size:19px;margin:0 0 26px;max-width:560px}
.perks{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 30px}
.perks > span{display:flex;align-items:center;gap:8px;color:var(--indigo);font-weight:500;font-size:15px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(48,22,103,.06);padding:8px 14px;border-radius:999px}
.perks .ic{width:18px;height:18px;color:var(--violet)}
.etapes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.etape{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.etape .chip{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center}
.etape b{display:block;font-family:'Space Grotesk';font-size:18px;color:var(--indigo);margin-top:12px}
.etape p{color:var(--muted);font-size:15px;margin:4px 0 0}
/* cartes */
.cards{display:grid;gap:12px}
.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
.card{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:#D9CCFD}
.card:active{transform:scale(.98)}
.card .chip{width:44px;height:44px;border-radius:14px;background:var(--lavp);color:var(--violet);display:grid;place-items:center;transition:all .2s}
.card .lg{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.card .lg img{width:28px;height:28px;object-fit:contain}
.card .av{width:52px;height:52px;border-radius:999px;object-fit:cover;box-shadow:0 2px 8px rgba(30,16,80,.18)}
.card .t{font-family:'Space Grotesk';font-weight:600;color:var(--indigo);line-height:1.2}
.card .s{font-size:13px;color:var(--muted)}
.card .tick{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:999px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;transition:all .2s}
.card .tick .ic{width:14px;height:14px;opacity:0}
.card.sel{border-color:var(--violet);background:linear-gradient(180deg,#fff,var(--lilac));box-shadow:0 14px 34px rgba(141,104,250,.22)}
.card.sel .chip{background:var(--grad);color:#fff}
.card.sel .tick{background:var(--violet);border-color:var(--violet);animation:pop .3s}
.card.sel .tick .ic{opacity:1}
@keyframes pop{50%{transform:scale(1.3)}}
.row-card{flex-direction:row;align-items:center;gap:14px}
.row-card .tx{flex:1;padding-right:26px}
/* pastilles d'outils */
.logos{display:flex;flex-wrap:wrap;gap:10px}
.logo-b{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px 7px 8px;font-size:15px;transition:all .15s}
.logo-b img{width:26px;height:26px;object-fit:contain}
.logo-b .ic{width:22px;height:22px;color:var(--violet)}
.logo-b:hover{border-color:#D9CCFD}
.logo-b.on{border-color:var(--violet);background:var(--lilac);box-shadow:0 6px 16px rgba(141,104,250,.2)}
.addrow{display:flex;gap:8px;margin-top:12px;max-width:420px}
.addrow input{flex:1}
/* champs */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px 16px;display:flex;flex-direction:column;gap:2px;transition:border-color .18s,box-shadow .18s}
.fld.full{grid-column:1/-1}
.fld:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(141,104,250,.15)}
.fld label{font-size:12px;font-weight:600;color:var(--grey2);text-transform:uppercase;letter-spacing:.08em}
.fld input,.fld textarea{display:block;width:100%;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);background:none;padding:4px 0;resize:vertical}
.fld.bad{border-color:var(--corail);box-shadow:0 0 0 4px rgba(228,118,90,.15)}
.mini-in{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:11px 18px;font:inherit;outline:0}
.mini-in:focus{border-color:var(--violet)}
.reveal{margin-top:14px;display:none}.reveal.on{display:block;animation:enter .3s}
/* liste à préparer */
.prep{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:6px 18px;box-shadow:var(--sh)}
.pi{display:flex;gap:14px;align-items:flex-start;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;text-align:left}
.pi:last-child{border-bottom:0}
.pi .box{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid #D3CBF3;display:grid;place-items:center;color:#fff;margin-top:2px;transition:all .2s}
.pi .box .ic{width:15px;height:15px;opacity:0}
.pi.on .box{background:var(--green);border-color:var(--green)}.pi.on .box .ic{opacity:1}
.pi .tx b{display:block;font-weight:600;color:var(--indigo)}
.pi .tx span{display:block;font-size:14px;color:var(--muted)}
.pi .who{display:flex;margin-left:auto;flex:0 0 auto}
.pi .who img{width:28px;height:28px;border-radius:999px;object-fit:cover;border:2px solid #fff;margin-left:-8px}
.pi a{color:var(--violet-deep);font-weight:600}
.legend{font-size:14px;color:var(--muted);margin:10px 2px 0}
/* participants */
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:1fr 1fr 40px;gap:10px;align-items:center}
.person .fld{padding:8px 14px}
.rm{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center}
.rm:hover{border-color:var(--corail);color:var(--corail)}
.rm .ic{width:16px;height:16px}
.addp{margin-top:10px;background:none;border:1.5px dashed #D9CCFD;border-radius:999px;padding:9px 18px;color:var(--violet-deep);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.addp .ic{width:16px;height:16px}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px}
.task .n{flex:0 0 36px;height:36px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700}
.task .fld{flex:1}
/* navigation */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
.btn{border:0;border-radius:999px;padding:15px 28px;font-weight:600;font-size:16px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .18s,box-shadow .18s,opacity .2s}
.btn .ic{width:18px;height:18px}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(141,104,250,.4)}
.btn-p:hover{transform:translateY(-2px)}
.btn-p:disabled{opacity:.5;cursor:wait;transform:none}
.btn-g{background:#fff;border:1.5px solid var(--line);color:var(--indigo)}
.btn-g:hover{border-color:var(--violet);color:var(--violet)}
.btn-big{padding:18px 34px;font-size:18px}
.err{color:var(--corail);font-size:14.5px;min-height:20px;margin-top:12px;font-weight:600}
/* fin */
.done{text-align:center;padding-top:50px}
.done .ok{width:88px;height:88px;border-radius:999px;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 16px 40px rgba(141,104,250,.4);animation:pop .5s}
.done .ok .ic{width:44px;height:44px}
.done h2{font-size:38px}
.done .lede{margin:0 auto 26px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left;margin-top:24px}
.next .etape b{margin-top:10px}
.remind{margin:22px auto 0;max-width:620px;text-align:left;background:#fff;border:1.5px dashed #D9CCFD;border-radius:20px;padding:16px 20px}
.remind b{font-family:'Space Grotesk';color:var(--indigo)}
.remind ul{margin:8px 0 0;padding-left:20px;color:#4A4560;font-size:15px}
footer{padding:20px;text-align:center;color:var(--grey2);font-size:13px}
@media (max-width:760px){.c4{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:1fr}.etapes,.next{grid-template-columns:1fr}.hero h1{font-size:36px}.form{grid-template-columns:1fr}.person{grid-template-columns:1fr 40px}.person .fld:nth-child(2){grid-column:1}.screen h2{font-size:26px}.q-ic{display:none}.stepn{display:none}.prog{max-width:none}}
@media (max-width:420px){.c4{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.card .s{display:none}}
</style>
</head>

<main class="wrap" id="app"></main>
<footer>Yelema, l'IA pour l'Afrique.</footer>

  <div class="sub">Votre service informatique bloque-t-il la connexion d'applications extérieures ? <small>Adresses protégées, double authentification imposée</small></div>
  <div class="cards c3" id="it">${[['non','check','Non'],['oui','shield','Oui'],['nsp','info','Je ne sais pas']].map(m => `<button class="card row-card${cardSel(st.it===m[0])}" data-it="${m[0]}">${tick}<div class="chip">${ic(m[1])}</div><span class="tx t">${m[2]}</span></button>`).join('')}</div>
  <div class="reveal${(st.it==='oui'||st.it==='nsp')?' on':''}" id="itbox"><div class="form" style="margin-top:6px"><div class="fld"><label for="itnom">Qui gère votre informatique</label><input id="itnom" value="${esc(st.itNom)}"></div><div class="fld"><label for="itemail">Son email</label><input id="itemail" type="email" value="${esc(st.itEmail)}"></div></div></div></section>`; },

outils(){
  const sel = st.experts, ordre = TOOLS.filter(t => !t[2].length || t[2].some(e => sel.includes(e)));
  const les = ordre.map(t => t[0]);
  return `<section class="screen on"><div class="q-ic">${ic('workflow')}</div><h2>Vos outils</h2><p class="lede">Touchez ceux que vos équipes utilisent déjà. Nous choisissons ce qu'on branche en premier.</p>
  <div class="logos" id="logos">${ordre.map(t => `<button class="logo-b${st.outils.includes(t[0])?' on':''}" data-outil="${esc(t[0])}"><img src="${lg(t[1])}" alt="">${t[0]}</button>`).join('')}${st.autresOutils.map(o => `<button class="logo-b on" data-outil="${esc(o)}">${ic('wrench')}${esc(o)}</button>`).join('')}</div>
  <div class="addrow"><input class="mini-in" id="outil-in" placeholder="Un autre outil ?"><button class="btn btn-g" style="padding:10px 18px" data-a="addtool">${ic('plus')}Ajouter</button></div>
  <div class="sub">Avez-vous déjà un compte d'assistant IA ?</div>
  <div class="logos" id="ias">${IAS.map(t => `<button class="logo-b${st.ias.includes(t[0])?' on':''}" data-ia="${t[0]}"><img src="${lg(t[1])}" alt="">${t[0]}</button>`).join('')}<button class="logo-b${st.ias.includes('Aucun')?' on':''}" data-ia="Aucun">${ic('x')}Aucun</button></div></section>`; },

preparer(){
  const l = listePrep();
  return `<section class="screen on"><div class="q-ic">${ic('list-checks')}</div><h2>À préparer pour la séance</h2><p class="lede">Votre liste est établie d'après vos Experts. Cochez ce qui est déjà prêt : nous relançons le reste la veille.</p>
  <div class="prep">${l.map(x => `<button class="pi${st.prets[x.k]?' on':''}" data-prep="${x.k}"><span class="box">${ic('check')}</span><span class="tx"><b>${x.t}</b>${x.s ? `<span>${x.s}</span>` : ''}${x.link ? `<span><a href="${x.link[0]}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${x.link[1]}</a></span>` : ''}</span>${x.who.length ? `<span class="who">${x.who.map(w => `<img src="${av(X(w).i)}" alt="${X(w).n}">`).join('')}</span>` : ''}</button>`).join('')}</div>
  <div class="sub">Un dossier partagé avec vos documents ? <small>Facultatif</small></div>
  <div class="fld" style="max-width:560px"><label for="dossier">Lien du dossier</label><input id="dossier" value="${esc(st.dossier)}" placeholder="https://"></div></section>`; },

seance(){ return `<section class="screen on"><div class="q-ic">${ic('calendar-check')}</div><h2>La séance</h2><p class="lede">Dernier écran. Dites-nous qui sera là et ce que vous voulez confier en premier.</p>
  <div class="sub">Qui participe à la séance</div>
  <div class="people" id="people">${st.gens.map((g,i) => `<div class="person"><div class="fld"><label>Nom</label><input data-g="n" data-i="${i}" value="${esc(g.n)}"></div><div class="fld"><label>Fonction</label><input data-g="f" data-i="${i}" value="${esc(g.f)}"></div>${st.gens.length>1 ? `<button class="rm" data-rm="${i}" aria-label="Retirer">${ic('x')}</button>` : '<span></span>'}</div>`).join('')}</div>
  <button class="addp" data-a="addp">${ic('plus')}Ajouter une personne</button>
  <div class="sub">Les trois tâches à confier en premier à vos Experts</div>
  <div class="tasks">${st.taches.map((t,i) => `<div class="task"><span class="n">${i+1}</span><div class="fld"><input data-t="${i}" value="${esc(t)}" placeholder="${['Par exemple : le calendrier de publication du mois','Par exemple : la relance des factures en retard','Par exemple : la synthèse du comité de lundi'][i]}"></div></div>`).join('')}</div>
  <div class="sub">Le téléphone des futurs utilisateurs</div>
  <div class="cards c3" id="tel">${[['iPhone','smartphone'],['Android','smartphone'],['Les deux','users']].map(m => `<button class="card row-card${cardSel(st.tel===m[0])}" data-tel="${m[0]}">${tick}<div class="chip">${ic(m[1])}</div><span class="tx t">${m[0]}</span></button>`).join('')}</div></section>`; },

fin(){
  const rest = listePrep().filter(x => !st.prets[x.k] && x.kind !== 'jour');
  return `<section class="screen on"><div class="done"><div class="ok">${ic('check')}</div><div class="eyebrow">Merci ${esc(st.admin.split(' ')[0] || '')}</div><h2>C'est envoyé</h2>
  <p class="lede">Nous préparons l'installation de ${st.experts.map(e => X(e).n).join(', ').replace(/, ([^,]*)$/, ' et $1')} chez ${esc(st.entreprise)}.</p>
  <div class="next"><div class="etape"><div class="chip">${ic('mail')}</div><b>L'invitation</b><p>Elle arrive à ${esc(st.email)} pour créer votre compte.</p></div>
  <div class="etape"><div class="chip">${ic('list-checks')}</div><b>La veille</b><p>Nous vérifions avec vous que tout est prêt.</p></div>
  <div class="etape"><div class="chip">${ic('rocket')}</div><b>Le jour J</b><p>Vos Experts travaillent pour vous à la fin de la séance.</p></div></div>
  ${rest.length ? `<div class="remind"><b>Encore à préparer</b><ul>${rest.map(x => `<li>${x.t}</li>`).join('')}</ul></div>` : `<div class="remind"><b>Tout est prêt de votre côté.</b></div>`}
  <p class="legend" id="envoi-note"></p></div></section>`; }
};

function titreEtape(){ return cur > 0 && cur < ETAPES.length - 1 ? `Étape ${cur} sur ${ETAPES.length - 2}` : ''; }
function nav(){
  if (cur === 0 || cur === ETAPES.length - 1) return '';
  const dernier = cur === ETAPES.length - 2;
  return `<div class="err" id="err"></div><div class="nav"><button class="btn btn-g" data-a="prec">${ic('arrow-left')}Retour</button><button class="btn btn-p" data-a="${dernier?'envoyer':'suiv'}" id="go">${dernier ? 'Envoyer' : 'Continuer'}${ic(dernier ? 'send' : 'arrow-right')}</button></div>`;
}
function rendre(){
  app.innerHTML = ecrans[ETAPES[cur]]() ;
  const sc = app.querySelector('.screen'); if (cur > 0 && cur < ETAPES.length - 1) sc.insertAdjacentHTML('beforeend', nav());
  document.getElementById('bar').style.width = (cur === 0 ? 0 : Math.round(cur / (ETAPES.length - 2) * 100)) + '%';
  if (cur === ETAPES.length - 1) document.getElementById('bar').style.width = '100%';
  document.getElementById('stepn').textContent = titreEtape();
  window.scrollTo({top:0});
}
function lire(){
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : null; };
  const m = ETAPES[cur];
  if (m === 'compte') { st.entreprise = g('entreprise'); st.admin = g('admin'); st.fonction = g('fonction'); st.email = g('email'); st.whatsapp = g('whatsapp'); }
  if (m === 'experts') { const v = g('inv'); if (v !== null) st.invites = v; }
  if (m === 'acces') { const a = g('mailautre-in'); if (a !== null) st.mailAutre = a; st.itNom = g('itnom') || ''; st.itEmail = g('itemail') || ''; }
  if (m === 'preparer') st.dossier = g('dossier') || '';
  if (m === 'seance') { app.querySelectorAll('[data-g]').forEach(i => { st.gens[+i.dataset.i][i.dataset.g] = i.value.trim(); }); app.querySelectorAll('[data-t]').forEach(i => { st.taches[+i.dataset.t] = i.value.trim(); }); }
}
function marquer(id, mal){ const e = document.getElementById(id); if (e) e.closest('.fld').classList.toggle('bad', mal); return mal; }
function verifier(){
  lire(); const m = ETAPES[cur]; let msg = '';
  if (m === 'compte') {
    const b = [marquer('entreprise', !st.entreprise), marquer('admin', !st.admin), marquer('email', !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.email)), marquer('whatsapp', st.whatsapp.replace(/\D/g,'').length < 8)];
    if (b.some(Boolean)) msg = 'Complétez les champs en rouge : entreprise, administrateur, une adresse email valide et un numéro WhatsApp.';
  }
  if (m === 'experts') { if (!st.experts.length) msg = 'Touchez au moins un Expert.'; else if (!st.mode) msg = 'Dites-nous comment vos équipes se connectent.'; else if (st.mode === 'perso' && !st.invites) msg = 'Indiquez le nom et l\'email des personnes à inviter.'; }
  if (m === 'acces') { if (!st.mail) msg = 'Choisissez votre messagerie.'; else if (!st.docs) msg = 'Choisissez où sont rangés vos documents.'; else if (!st.it) msg = 'Répondez à la question sur votre service informatique.'; }
  if (m === 'seance') { if (!st.gens.some(g => g.n)) msg = 'Indiquez au moins une personne présente à la séance.'; else if (!st.taches.some(Boolean)) msg = 'Indiquez au moins une tâche à confier.'; }
  const e = document.getElementById('err'); if (e) e.textContent = msg; return !msg;
}
function charge(){
  const l = listePrep();
  const exp = st.experts.map(e => X(e).n).join(', ');
  const pret = l.filter(x => st.prets[x.k]).map(x => x.t), reste = l.filter(x => !st.prets[x.k]).map(x => x.t);
  return {
    _subject: 'Avant installation Yelema : ' + st.entreprise, _template: 'table', _captcha: 'false', Page: 'Avant votre installation (maquette leslita06)',
    'Entreprise': st.entreprise, 'Administrateur': st.admin + (st.fonction ? ', ' + st.fonction : ''), 'Email invitation': st.email, 'WhatsApp': st.whatsapp,
    'Experts choisis': exp, 'Connexion': ({partage:'Un compte partagé',perso:'Un compte par personne',nsp:'Pas encore décidé'})[st.mode], 'Personnes à inviter': st.invites,
    'Messagerie': st.mail + (st.mailAutre ? ' : ' + st.mailAutre : ''), 'Documents rangés dans': st.docs,
    'Blocage informatique': ({non:'Non',oui:'Oui',nsp:'Ne sait pas'})[st.it], 'Contact informatique': [st.itNom, st.itEmail].filter(Boolean).join(', '),
    'Outils utilisés': st.outils.concat(st.autresOutils).join(', '), 'Comptes IA': st.ias.join(', '),
    'Déjà prêt': pret.join(' ; '), 'Pas encore prêt': reste.join(' ; '), 'Dossier partagé': st.dossier,
    'Participants': st.gens.filter(g => g.n).map(g => g.n + (g.f ? ' (' + g.f + ')' : '')).join(' ; '),
    'Trois premières tâches': st.taches.filter(Boolean).map((t,i) => (i+1) + '. ' + t).join(' ; '), 'Téléphones': st.tel || ''
  };
}
function envoyer(b){
  if (!verifier()) return;
  const c = charge(); b.disabled = true; b.textContent = 'Envoi en cours…';
  const fini = (ok) => { cur = ETAPES.length - 1; rendre(); const n = document.getElementById('envoi-note'); if (!ok && n) { const corps = Object.entries(c).filter(([k]) => k[0] !== '_' && k !== 'Page').map(([k,v]) => v ? k + ' : ' + v : '').filter(Boolean).join('\n'); n.innerHTML = 'Votre envoi automatique a échoué. <a href="mailto:contact@yelema.ai?subject=' + encodeURIComponent(c._subject) + '&body=' + encodeURIComponent(corps) + '" style="color:var(--violet-deep);font-weight:600">Envoyez-nous vos réponses par email</a>.'; } };
  fetch('https://formsubmit.co/ajax/contact@yelema.ai', { method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'}, body: JSON.stringify(c) })
    .then(r => r.json()).then(x => { if (String(x && x.success) !== 'true') throw 0; fini(true); }).catch(() => fini(false));
}
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset, a = d.a, err = document.getElementById('err'); if (err) err.textContent = '';
  if (a === 'prec') { lire(); cur = Math.max(0, cur - 1); return rendre(); }
  if (a === 'suiv') { if (cur === 0 || verifier()) { cur++; rendre(); } return; }
  if (a === 'envoyer') return envoyer(b);
  if (a === 'addp') { lire(); st.gens.push({n:'',f:''}); return rendre(); }
  if (a === 'addtool') { const i = document.getElementById('outil-in'), v = i.value.trim(); if (!v) return; if (!st.autresOutils.includes(v)) st.autresOutils.push(v); lire(); return rendre(); }
  if (d.rm !== undefined) { lire(); st.gens.splice(+d.rm, 1); return rendre(); }
  const un = (cle, val, groupe) => { st[cle] = val; app.querySelectorAll(groupe + ' .card').forEach(c => c.classList.toggle('sel', c === b)); };
  if (d.ex) { const i = st.experts.indexOf(d.ex); i < 0 ? st.experts.push(d.ex) : st.experts.splice(i, 1); b.classList.toggle('sel'); return; }
  if (d.mode) { un('mode', d.mode, '#mode'); document.getElementById('invites').classList.toggle('on', d.mode === 'perso'); return; }
  if (d.mail) { un('mail', d.mail, '#mail'); document.getElementById('mailautre').classList.toggle('on', d.mail === 'Autre'); return; }
  if (d.docs) return un('docs', d.docs, '#docs');
  if (d.it) { un('it', d.it, '#it'); document.getElementById('itbox').classList.toggle('on', d.it !== 'non'); return; }
  if (d.tel) return un('tel', d.tel, '#tel');
  if (d.outil) { const l = st.outils, i = l.indexOf(d.outil); if (i >= 0) l.splice(i, 1); else if (st.autresOutils.includes(d.outil)) st.autresOutils.splice(st.autresOutils.indexOf(d.outil), 1); else l.push(d.outil); return b.classList.toggle('on'); }
  if (d.ia) { const l = st.ias; if (d.ia === 'Aucun') { st.ias = l.includes('Aucun') ? [] : ['Aucun']; } else { st.ias = l.filter(x => x !== 'Aucun'); const i = st.ias.indexOf(d.ia); i < 0 ? st.ias.push(d.ia) : st.ias.splice(i, 1); } app.querySelectorAll('#ias .logo-b').forEach(x => x.classList.toggle('on', st.ias.includes(x.dataset.ia))); return; }
  if (d.prep) { st.prets[d.prep] = !st.prets[d.prep]; return b.classList.toggle('on', !!st.prets[d.prep]); }
});
rendre();
})();
</script>
</body>
</html>
